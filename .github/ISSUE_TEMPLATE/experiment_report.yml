name: Pi 验证记录
description: 记录 ChatDome、原版 Pi 与 ChatDomePro 的可复现对比结果
title: "experiment: "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        使用冻结输入和一致配置进行对比。提交前请移除密钥、访问令牌、个人数据和未脱敏的日志。

  - type: textarea
    id: hypothesis
    attributes:
      label: 验证目标
      description: 写明要验证的能力、指标和预期结果。
      placeholder: 在相同模型和工具权限下，ChatDomePro 应……
    validations:
      required: true

  - type: checkboxes
    id: targets
    attributes:
      label: 对比对象
      options:
        - label: ChatDome
        - label: 原版 Pi
        - label: ChatDomePro
    validations:
      required: true

  - type: input
    id: case_ids
    attributes:
      label: 评测用例
      description: 填写冻结用例编号；新用例请同时附输入和通过条件。
      placeholder: 例如 E01、E04、E09
    validations:
      required: true

  - type: textarea
    id: controls
    attributes:
      label: 固定条件
      description: 填写模型、供应商、推理强度、系统提示、工具权限、轮次上限和运行次数。
      render: yaml
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: 版本信息
      description: 填写各对比对象的提交哈希或发布版本，以及 Node.js、Python 和操作系统版本。
      render: shell
    validations:
      required: true

  - type: textarea
    id: results
    attributes:
      label: 结果
      description: 按运行记录成功率、耗时、工具调用、错误和人工干预次数。
      placeholder: |
        | 对象 | 运行次数 | 通过次数 | 耗时 | 工具调用 | 人工干预 |
        | --- | ---: | ---: | ---: | ---: | ---: |
        | ChatDomePro |  |  |  |  |  |
    validations:
      required: true

  - type: textarea
    id: token_usage
    attributes:
      label: Token 使用量
      description: 分别记录输入、输出、缓存读取、缓存写入、工具结果和无法计量的部分。
      placeholder: |
        | 对象 | 输入 | 输出 | 缓存读取 | 缓存写入 | 工具结果 | 未计量项 |
        | --- | ---: | ---: | ---: | ---: | ---: | --- |
        | ChatDomePro |  |  |  |  |  |  |
    validations:
      required: true

  - type: textarea
    id: artifacts
    attributes:
      label: 证据位置
      description: 填写已脱敏的日志、轨迹、截图或结果文件路径。

  - type: textarea
    id: conclusion
    attributes:
      label: 结论与下一步
      description: 说明假设是否成立、主要差异和建议动作。
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交检查
      options:
        - label: 各对象使用了可比较的固定条件，差异已明确记录。
          required: true
        - label: Token 使用量包含计量口径和未覆盖项。
          required: true
        - label: 证据中不包含密钥、访问令牌或个人数据。
          required: true
